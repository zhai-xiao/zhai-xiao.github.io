title: Xiao Zhai
description: Simulation Researcher at Weta Digital
logo: /assets/img/logo.jpeg

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Plugins (GitHub Pages compatible)
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Theme
theme: minima

# Collections
collections:
  movies:
    output: true
    permalink: /:collection/:name/

# SEO
minimal_mistakes_skin: "dark"
search: true

# Google Analytics (optional)
analytics:
  provider: "google-universal"